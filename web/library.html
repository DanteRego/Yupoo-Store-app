<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kit-token" content="{{TOKEN}}">
<meta name="kit-lang" content="{{LANG}}">
<title>Yupoo Library</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <div class="left">
      <h1><img src="icon.svg" alt="">Yupoo Library <span class="count"></span></h1>
      <button class="iconbtn" data-act="refresh" title="Show items saved since this page was opened (e.g. from Save whole store)"><span>⟳</span> Refresh</button>
    </div>
    <form class="go">
      <input class="link" type="text" placeholder="Paste a Yupoo link, e.g. shida-tiyu888.x.yupoo.com/albums" autocomplete="off" spellcheck="false">
      <button type="submit">Open</button>
      <div class="pastehint" hidden></div>
    </form>
    <div class="actions">
      <button class="navbtn" data-act="catalog" title="Your collections of saved items">📒 Wishlist</button>
      <button class="navbtn win" data-act="catalog-win" title="Open the Wishlist in its own window">⧉</button>
      <label class="toggle"><input type="checkbox" class="autosave"> Auto-save while browsing</label>
      <button data-act="update" title="See if a newer version of Yupoo Library is out" hidden>⬆ Check for updates</button>
      <button class="iconbtn" data-act="theme" title="Light / dark mode"></button>
      <button class="iconbtn" data-act="settings" title="Settings: language, photos folder…">⚙ Settings</button>
    </div>
  </header>
  <div class="body">
    <aside>
      <div class="list newlist"></div>
      <h3>Categories</h3>
      <div class="list cats"></div>
      <h3>Stores</h3>
      <div class="list stores"></div>
    </aside>
    <main>
      <div class="topbar">
      <div class="filters">
        <input class="q" type="search" placeholder="Search items — name, team, season, store or Chinese title">
        <div class="dds"></div>
        <select class="sort">
          <option value="team">Category, then brand / team</option>
          <option value="brand">Brand A–Z</option>
          <option value="new">Season: newest first</option>
          <option value="old">Season: oldest first</option>
          <option value="saved">Recently saved</option>
        </select>
        <button class="clear" hidden>✕ Clear filters</button>
        <button class="selbtn" title="Select several items to move them to a category at once">☑ Select</button>
      </div>
      <div class="sumrow"><span class="summary"></span><span class="grow"></span>
        <nav class="pager top" aria-label="Pages"></nav>
        <select class="perpage" title="Items per page"><option value="60">60 per page</option><option value="120">120 per page</option><option value="240">240 per page</option></select>
      </div>
      </div>
      <div class="newhead" hidden></div>
      <div class="grid"></div>
      <nav class="pager bottom" aria-label="Pages"></nav>
      <div class="selbar" hidden>
        <span class="selcount"></span>
        <button data-sel="page"></button>
        <button data-sel="all"></button>
        <button data-sel="none" class="needs">Clear</button>
        <span class="sep"></span>
        <div class="mv"><button class="mv-btn needs">Move to… ▾</button>
          <div class="dd-panel" hidden><input type="search" placeholder="Search or type a new category…" autocomplete="off"><div class="dd-list"></div></div></div>
        <button data-sel="collect" class="needs" title="Add the selected items to a collection in your Wishlist">☆ Add to collection ▾</button>
        <button data-sel="auto" class="needs" title="Forget your picks and let the item sorter decide again">Let sorter decide</button>
        <button data-sel="remove" class="needs">🗑 Remove</button>
        <button data-sel="done" class="done">Done</button>
      </div>
    </main>
  </div>
  <div class="toast"></div>
  <script src="i18n.js"></script>
  <script src="teams.js"></script>
  <script src="categories.js"></script>
  <script src="brands.js"></script>
  <script src="shared.js"></script>
  <script src="library.js"></script>
  <script src="crawlbar.js"></script>
</body>
</html>
