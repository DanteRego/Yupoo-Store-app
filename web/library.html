<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kit-token" content="{{TOKEN}}">
<title>Yupoo Library</title>
<link rel="icon" href="icon.svg">
<style>
  :root { --green: #1f7a4d; --ink: #1c2321; --muted: #5f6b67; --line: #dde3e0; --bg: #f4f6f5; --card: #fff; --soft: #eef3f0; --warn: #9a5b00; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e7ecea; --muted: #9aa6a1; --line: #2c3532; --bg: #141918; --card: #1c2321; --soft: #25302c; --warn: #f0b35a; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; background: var(--green); color: #fff; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 10px; }
  header h1 img { width: 26px; height: 26px; }
  header .count { font-weight: 400; opacity: .85; font-size: 14px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, .btn { cursor: pointer; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 13px; background: var(--soft); color: var(--ink); font-family: inherit; }
  header button, header .btn { background: rgba(255,255,255,.16); color: #fff; }
  header button:hover, header .btn:hover { background: rgba(255,255,255,.28); }
  label.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; padding: 0 6px; }
  .body { flex: 1; display: flex; min-height: 0; }
  aside { width: 260px; flex-shrink: 0; border-right: 1px solid var(--line); background: var(--card); overflow-y: auto; padding-bottom: 20px; }
  aside h3 { margin: 16px 16px 8px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  input, select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
  input:focus, select:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  .teamq { width: calc(100% - 28px); margin: 0 14px 6px; }
  .list { padding: 0 8px; }
  .item { cursor: pointer; display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: transparent; padding: 7px 8px; border-radius: 6px; }
  .item:hover { background: var(--soft); }
  .item.on { background: var(--green); color: #fff; }
  .item .c { color: var(--muted); font-variant-numeric: tabular-nums; }
  .item.on .c { color: #d6eadf; }
  .item.warn { color: var(--warn); }
  .item.top { font-weight: 600; margin-top: 4px; }
  .item.sub { padding-left: 22px; font-size: 13px; }
  .catline { font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--green); }
  @media (prefers-color-scheme: dark) { .catline { color: #6fd0a0; } }
  .catline.unsorted { color: var(--warn); }
  .catline .tag { text-transform: none; letter-spacing: 0; font-weight: 400; }
  main { flex: 1; overflow-y: auto; padding: 16px 18px 40px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters .q { flex: 1; min-width: 240px; }
  .summary { margin: 10px 0; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .card { background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); display: flex; flex-direction: column; }
  .img { position: relative; display: block; aspect-ratio: 1 / 1; background: var(--soft); }
  .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img.waiting::after { content: "Photo loading…"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .img .n { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 10px; }
  .meta { padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .en { font-weight: 600; line-height: 1.3; }
  .en.unsorted { color: var(--warn); }
  .zh { color: var(--muted); font-size: 12px; word-break: break-all; }
  .src { color: var(--muted); font-size: 11px; }
  .row { margin-top: auto; padding-top: 7px; display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .row a { color: var(--green); text-decoration: none; font-weight: 600; margin-right: auto; }
  @media (prefers-color-scheme: dark) { .row a { color: #6fd0a0; } }
  .row a:hover { text-decoration: underline; }
  .row button { padding: 4px 8px; font-size: 12px; }
  .tag { font-size: 11px; color: var(--green); }
  .more { display: block; margin: 20px auto 0; background: var(--green); color: #fff; padding: 10px 20px; }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); max-width: 520px; margin: 0 auto; }
  .empty strong { color: var(--ink); display: block; font-size: 17px; margin-bottom: 8px; }
  form.go { flex: 1; display: flex; gap: 6px; max-width: 560px; min-width: 260px; }
  form.go input { flex: 1; border: 0; }
  form.go button { background: #fff; color: var(--green); font-weight: 600; }
  .item .open { color: var(--green); font-size: 12px; text-decoration: none; padding: 0 4px; }
  .item.on .open { color: #fff; }
  .item .ren { background: transparent; padding: 0 4px; font-size: 12px; color: var(--muted); visibility: hidden; }
  .item:hover .ren, .item.on .ren { visibility: visible; }
  .item.on .ren { color: #fff; }
  .dds { display: flex; gap: 8px; flex-wrap: wrap; }
  .dd { position: relative; }
  .dd-btn { border: 1px solid var(--line); background: var(--card); padding: 8px 10px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .dd-btn.on { background: var(--green); border-color: var(--green); color: #fff; }
  .dd-panel { position: absolute; top: calc(100% + 4px); left: 0; z-index: 10; width: 280px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); padding: 8px; }
  .dd-panel input { width: 100%; margin-bottom: 6px; }
  .dd-list { max-height: 320px; overflow-y: auto; }
  .dd-list .item { border: 0; font-size: 13px; }
  .clear { background: transparent; color: var(--warn); }
  .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #1c2321; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.3); font-size: 13px; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.act { pointer-events: auto; }
  .selecting .toast { bottom: 96px; }
  .toast-act { margin-left: 10px; background: #fff; color: #1f7a4d; font-weight: 600; padding: 5px 12px; }
  .selbtn.on { background: var(--green); color: #fff; }
  .card { position: relative; }
  .tick { display: none; position: absolute; top: 8px; left: 8px; z-index: 2; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.35); color: transparent; font-weight: 700; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .selecting .tick { display: grid; }
  .selecting .card { cursor: pointer; user-select: none; }
  .selecting .card .row { pointer-events: none; opacity: .35; }
  .selecting .card:hover { box-shadow: 0 0 0 2px var(--line), 0 1px 3px rgba(0,0,0,.1); }
  .card.picked { box-shadow: 0 0 0 3px var(--green) !important; }
  .card.picked .tick { background: var(--green); color: #fff; }
  .card.picked .img img { opacity: .85; }
  .selecting main { padding-bottom: 90px; }
  .selbar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .selcount { font-weight: 600; padding: 0 8px; white-space: nowrap; }
  .selbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .selbar button:disabled { opacity: .45; cursor: default; }
  .mv { position: relative; }
  .mv-btn { background: var(--green); color: #fff; font-weight: 600; }
  .mv .dd-panel { top: auto; bottom: calc(100% + 8px); width: 300px; }
  .mv .dd-list { max-height: 360px; }
  .item.new { color: var(--green); font-weight: 600; }
  .selbar .done { font-weight: 600; }
  .empty ol { text-align: left; display: inline-block; margin: 12px 0 0; padding-left: 20px; line-height: 1.7; }
  @media (max-width: 760px) { aside { width: 180px; } .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
</style>
</head>
<body>
  <header>
    <h1><img src="icon.svg" alt="">Yupoo Library <span class="count"></span></h1>
    <form class="go">
      <input class="link" type="text" placeholder="Paste a Yupoo link, e.g. shida-tiyu888.x.yupoo.com/albums" autocomplete="off" spellcheck="false">
      <button type="submit">Open</button>
    </form>
    <div class="actions">
      <label class="toggle"><input type="checkbox" class="autosave"> Auto-save while browsing</label>
      <button data-act="csv">Export CSV</button>
      <button data-act="backup">Backup</button>
      <label class="btn">Restore<input type="file" class="restore" accept=".zip,application/zip" hidden></label>
    </div>
  </header>
  <div class="body">
    <aside>
      <h3>Categories</h3>
      <div class="list cats"></div>
      <h3>Teams</h3>
      <input class="teamq" type="search" placeholder="Search teams (EN / 中文)">
      <div class="list teams"></div>
      <h3>Stores</h3>
      <div class="list stores"></div>
    </aside>
    <main>
      <div class="filters">
        <input class="q" type="search" placeholder="Search items — name, team, season, store or Chinese title">
        <div class="dds"></div>
        <select class="sort">
          <option value="team">Category, then team</option>
          <option value="new">Season: newest first</option>
          <option value="old">Season: oldest first</option>
          <option value="saved">Recently saved</option>
        </select>
        <button class="clear" hidden>✕ Clear filters</button>
        <button class="selbtn" title="Select several items to move them to a category at once">☑ Select</button>
      </div>
      <div class="summary"></div>
      <div class="grid"></div>
      <button class="more" hidden>Show more</button>
      <div class="selbar" hidden>
        <span class="selcount"></span>
        <button data-sel="page"></button>
        <button data-sel="all"></button>
        <button data-sel="none" class="needs">Clear</button>
        <span class="sep"></span>
        <div class="mv"><button class="mv-btn needs">Move to… ▾</button>
          <div class="dd-panel" hidden><input type="search" placeholder="Search or type a new category…" autocomplete="off"><div class="dd-list"></div></div></div>
        <button data-sel="auto" class="needs" title="Forget your picks and let the item sorter decide again">Let sorter decide</button>
        <button data-sel="remove" class="needs">🗑 Remove</button>
        <button data-sel="done" class="done">Done</button>
      </div>
    </main>
  </div>
  <div class="toast"></div>
  <script src="teams.js"></script>
  <script src="categories.js"></script>
  <script src="library.js"></script>
  <script src="crawlbar.js"></script>
</body>
</html>
