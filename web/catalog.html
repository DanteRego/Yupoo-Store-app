<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kit-token" content="{{TOKEN}}">
<meta name="kit-lang" content="{{LANG}}">
<title>Wishlist — Yupoo Library</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body class="catalog">
  <header>
    <div class="left">
      <button class="navbtn" data-act="library" title="Back to the Library (your place there is kept)">◀ Library</button>
      <h1><img src="icon.svg" alt="">Wishlist <span class="count"></span></h1>
    </div>
    <div class="actions">
      <button class="navbtn win" data-act="newwin" title="Open the Wishlist in its own window">⧉ New window</button>
      <button class="iconbtn" data-act="theme" title="Light / dark mode"></button>
      <button class="iconbtn" data-act="settings" title="Settings: language, photos folder…">⚙ Settings</button>
    </div>
  </header>
  <div class="body">
    <aside>
      <div class="list allcols"></div>
      <h3>Collections</h3>
      <div class="list cols"></div>
      <button class="newcol" data-act="new">＋ New collection</button>
      <label class="newcol" title="Open a collection file someone sent you (made with 📤 Export to share)">📥 Import a shared collection<input type="file" class="importcol" accept=".json,application/json" hidden></label>
    </aside>
    <main>
      <div class="topbar">
      <div class="coltitle">
        <h2 class="colname"></h2>
        <span class="sub colsub"></span>
        <span class="grow"></span>
        <button data-act="rename" class="needcol">✎ Rename</button>
        <button data-act="share" class="needcol" title="Save this collection as a file you can send to someone else with Yupoo Library">📤 Export to share</button>
        <button data-act="csv">Export CSV</button>
        <button data-act="delete" class="needcol">🗑 Delete collection</button>
      </div>
      <div class="moving exportbar" hidden>
        <div class="track"><div class="fill"></div></div>
        <div class="movetext exporttext"></div>
      </div>
      <div class="filters">
        <input class="q" type="search" placeholder="Search this collection — name, team, store, note…">
        <select class="sort">
          <option value="added">Recently added</option>
          <option value="oldest">Oldest first</option>
          <option value="cat">Category</option>
          <option value="name">Name A–Z</option>
          <option value="brand">Brand A–Z</option>
          <option value="store">Store</option>
        </select>
      </div>
      <div class="summary"></div>
      </div>
      <div class="grid"></div>
    </main>
  </div>
  <div class="toast"></div>
  <script src="i18n.js"></script>
  <script src="teams.js"></script>
  <script src="categories.js"></script>
  <script src="brands.js"></script>
  <script src="shared.js"></script>
  <script src="catalog.js"></script>
  <script src="crawlbar.js"></script>
</body>
</html>
